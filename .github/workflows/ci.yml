name: Quality CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Prepare SDK 58 dependency candidate
        id: candidate
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/001-ci-backup' }}
        run: |
          npm install --save-exact expo@58.1.0 expo-web-browser@58.1.0 expo-auth-session@58.0.20 expo-crypto@58.0.9 expo-location@58.0.23 expo-splash-screen@58.0.15
          npm install --save-dev --save-exact jest-expo@58.0.16
          npm ci
          git diff --stat
      - name: Save dependency candidate
        if: ${{ steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk58-dependency-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 3
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.candidate.outcome != 'failure' }}
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.candidate.outcome != 'failure' }}
        run: npm run typecheck
      - name: Jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.candidate.outcome != 'failure' }}
        run: npm test -- --ci --runInBand
      - name: Expo Doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.candidate.outcome != 'failure' }}
        run: npx --yes expo-doctor
      - name: Web build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.candidate.outcome != 'failure' }}
        run: npx expo export --platform web
