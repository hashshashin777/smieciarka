name: Import verified SDK 58 lockfile
on:
  push:
    branches: [fix/001-ci-backup]
    paths: [.github/workflows/import-sdk58-lock.yml]
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'hashshashin777/smieciarka' && github.ref == 'refs/heads/fix/001-ci-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sdk58-dependency-candidate
          run-id: 46093479738
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify and commit exact tested files
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          echo 'ba652bcc77478093afe2b3bf790c22a09d23f2dc63eac87129baa3b6be13bf4f  package.json' | sha256sum -c -
          echo '6ff042bd8248b0d5f660990e44b83b97a4306ff326b7f0342878445f8a1d6dd5  package-lock.json' | sha256sum -c -
          cp package.json package-lock.json ..
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'fix(expo): persist verified SDK 58 dependency candidate'
          git push origin HEAD:refs/heads/fix/001-ci-backup
